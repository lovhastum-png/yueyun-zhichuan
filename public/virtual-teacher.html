<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>越韵智传 · 虚拟越剧老师</title>
  <meta name="description" content="AI 虚拟越剧老师：3D 形象 + 语音教学 + RAG 智能问答" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="preload" href="/js/3d-stage-runtime.js?v=20260913-mtyq5uoh" as="script" />
  <link rel="preload" href="/assets/3d-stage/vroid/yueju-base.fast.vrm?v=20260820" as="fetch" crossorigin />
  <!-- 服装层停用：Y-5 测试期间不预加载服装 GLB -->
  <style>
    .page-teacher .teacher-main {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      height: calc(100vh - 200px);
      min-height: 580px;
    }

    /* ===== 3D 舞台区 ===== */
    .teacher-stage {
      position: relative;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(58,125,123,0.12) 0%, transparent 60%),
        linear-gradient(180deg, rgba(245,240,232,0.95) 0%, rgba(220,210,190,0.85) 100%);
      border: 1px solid var(--ink-10);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--shadow-ink);
    }
    #teacherCanvas { width: 100%; height: 100%; display: block; }
    /* 水墨背景装饰 */
    .stage-bg-ink {
      position: absolute;
      pointer-events: none;
      opacity: 0.15;
      filter: blur(2px);
    }
    .stage-bg-ink.ink-1 {
      width: 320px; height: 320px;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
      top: -60px; left: -40px;
    }
    .stage-bg-ink.ink-2 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, var(--cinnabar), transparent 70%);
      bottom: -40px; right: -30px;
    }
    .stage-title {
      position: absolute;
      top: 16px; left: 20px;
      z-index: 5;
      pointer-events: none;
    }
    .stage-title .name {
      font-family: var(--font-brush);
      font-size: 24px;
      letter-spacing: 6px;
      color: var(--ink);
      text-shadow: 0 2px 8px rgba(255,253,247,0.6);
    }
    .stage-title .sub {
      font-size: 12px;
      color: var(--ink-light);
      letter-spacing: 4px;
      margin-top: 2px;
      font-family: var(--font-kai);
    }
    .stage-seal {
      position: absolute;
      top: 16px; right: 20px;
      z-index: 5;
    }

    /* 老师说话气泡 */
    .teacher-bubble {
      position: absolute;
      bottom: 84px; left: 24px; right: 24px;
      background: rgba(255, 253, 247, 0.95);
      border: 1px solid var(--ink-10);
      border-left: 3px solid var(--cinnabar);
      border-radius: var(--r-md);
      padding: 14px 18px;
      font-size: 14px;
      line-height: 1.85;
      color: var(--ink);
      max-height: 120px;
      overflow-y: auto;
      font-family: var(--font-kai);
      box-shadow: var(--shadow-ink);
      backdrop-filter: blur(6px);
      z-index: 5;
      display: none;
    }
    .teacher-bubble.show { display: block; animation: fadeUp 0.4s var(--ease-brush); }
    .teacher-bubble.streaming::after {
      content: '▍';
      color: var(--cinnabar);
      animation: blink 0.9s steps(2) infinite;
      margin-left: 2px;
    }
    .teacher-bubble .src-mark {
      display: inline-block;
      font-size: 11px;
      color: var(--cyan);
      background: rgba(58,125,123,0.1);
      padding: 1px 6px;
      border-radius: 3px;
      margin: 0 2px;
    }

    /* 人物脸部旁情绪 emoji 气泡：仅说话/思考/生气时显示（🤔思考 😊回答 😠生气） */
    .emoji-bubble {
      position: absolute;
      top: 18%; left: 63%;
      width: 58px; height: 58px;
      display: none;
      align-items: center; justify-content: center;
      font-size: 32px;
      background: rgba(255, 253, 247, 0.95);
      border: 1px solid var(--ink-10);
      border-radius: 50%;
      box-shadow: var(--shadow-ink);
      z-index: 6;
      transition: transform 0.25s var(--ease-brush);
    }
    .emoji-bubble.show { display: flex; animation: floatEmoji 3s ease-in-out infinite; }
    .emoji-bubble::after {
      content: '';
      position: absolute;
      left: -9px; bottom: 12px;
      border: 9px solid transparent;
      border-right-color: rgba(255, 253, 247, 0.95);
      border-left: 0;
    }
    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* 朗读字幕：跟随真实发音逐句高亮 */
    .teacher-subtitle {
      position: absolute;
      bottom: 24px; left: 24px; right: 24px;
      padding: 8px 16px;
      background: rgba(38, 30, 24, 0.82);
      border: 1px solid rgba(255,253,247,0.18);
      border-left: 3px solid var(--cinnabar);
      border-radius: var(--r-md);
      color: #fff7ec;
      font-family: var(--font-kai);
      font-size: 15px;
      line-height: 1.7;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      box-shadow: var(--shadow-ink);
      backdrop-filter: blur(4px);
      z-index: 6;
      display: none;
    }
    .teacher-subtitle.show { display: block; animation: fadeUp 0.3s var(--ease-brush); }

    /* 状态指示器 */
    .teacher-status {
      position: absolute;
      top: 16px; left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(255,255,255,0.85);
      border: 1px solid var(--ink-10);
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink-light);
      font-family: var(--font-kai);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--ink-20);
    }
    .status-dot.thinking { background: var(--ochre); animation: pulse 1.2s infinite; }
    .status-dot.speaking { background: var(--cinnabar); animation: pulse 0.8s infinite; }
    .status-dot.ready { background: var(--cyan); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* 控制按钮 */
    .stage-controls {
      position: absolute;
      bottom: 180px; right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }
    .stage-ctrl-btn {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--ink-10);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      color: var(--ink);
      transition: all 0.2s;
    }
    .stage-ctrl-btn:hover { background: var(--ink); color: var(--paper); transform: scale(1.08); }
    .stage-ctrl-btn.active { background: var(--cinnabar); color: var(--paper); border-color: var(--cinnabar); }

    /* 加载提示 */
    .stage-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(245,240,232,0.9);
      z-index: 10;
    }
    .stage-loading .loader-content {
      text-align: center;
      color: var(--ink-light);
    }
    .stage-loading .loader-icon {
      font-family: var(--font-brush);
      font-size: 48px;
      color: var(--cinnabar);
      margin-bottom: 12px;
      animation: pulse 1.5s infinite;
    }
    .stage-loading .loader-text {
      font-family: var(--font-kai);
      font-size: 14px;
    }
    /* 首屏水墨占位形象：模型加载时先呈现，提升等待体感 */
    .stage-loading .loader-ink {
      display: block;
      margin: 0 auto 12px;
      animation: inkFloat 2.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 10px rgba(38,30,24,0.25));
    }
    @keyframes inkFloat {
      0%, 100% { transform: translateY(0); opacity: 0.85; }
      50% { transform: translateY(-8px); opacity: 1; }
    }

    /* ===== 对话区 ===== */
    .teacher-chat {
      display: flex;
      flex-direction: column;
      background: rgba(255, 253, 247, 0.7);
      border: 1px solid var(--ink-10);
      border-radius: var(--r-lg);
      overflow: hidden;
      box-shadow: var(--shadow-ink);
    }
    .chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--ink-10);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.5);
    }
    .chat-header .title {
      font-family: var(--font-brush);
      font-size: 18px;
      letter-spacing: 3px;
      color: var(--ink);
    }
    .chat-header .subtitle {
      font-size: 12px;
      color: var(--ink-light);
      font-family: var(--font-kai);
    }
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat-history::-webkit-scrollbar { width: 6px; }
    .chat-history::-webkit-scrollbar-thumb { background: var(--ink-20); border-radius: 3px; }

    .msg { display: flex; gap: 10px; animation: fadeUp 0.4s var(--ease-brush) both; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      flex-shrink: 0;
      width: 34px; height: 34px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--font-brush);
      font-size: 16px;
      color: var(--paper);
    }
    .msg.assistant .msg-avatar { background: var(--cinnabar); }
    .msg.user .msg-avatar { background: var(--cyan); }
    .msg-body { max-width: 80%; }
    .msg.user .msg-body { display: flex; flex-direction: column; align-items: flex-end; }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: var(--r-md);
      font-size: 14px;
      line-height: 1.75;
      word-break: break-word;
    }
    .msg.assistant .msg-bubble {
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--ink-10);
      border-top-left-radius: 4px;
      color: var(--ink);
      font-family: var(--font-kai);
    }
    .msg.user .msg-bubble {
      background: var(--cyan);
      color: var(--paper);
      border-top-right-radius: 4px;
    }
    .msg-bubble .src-mark {
      display: inline-block;
      font-size: 11px;
      color: var(--cyan);
      background: rgba(58,125,123,0.1);
      padding: 1px 6px;
      border-radius: 3px;
      margin: 0 2px;
    }
    .msg-replay {
      font-size: 11px;
      color: var(--cinnabar);
      cursor: pointer;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .msg-replay:hover { text-decoration: underline; }

    /* 输入区 */
    .chat-input-area {
      padding: 12px;
      border-top: 1px solid var(--ink-10);
      background: rgba(255,255,255,0.5);
    }
    .example-qs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .example-qs::-webkit-scrollbar { height: 4px; }
    .example-q {
      flex-shrink: 0;
      padding: 5px 12px;
      background: rgba(255,253,247,0.7);
      border: 1px solid var(--ink-10);
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink-soft);
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-kai);
      transition: all 0.2s;
    }
    .example-q:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .chat-composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .chat-composer textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      padding: 10px 14px;
      border: 1px solid var(--ink-10);
      border-radius: var(--r-sm);
      font-size: 14px;
      font-family: var(--font-kai);
      background: rgba(255,255,255,0.85);
      resize: none;
    }
    .chat-composer textarea:focus { border-color: var(--cyan); outline: none; }
    .send-btn {
      width: 44px; height: 44px;
      border: none;
      border-radius: var(--r-sm);
      background: var(--cinnabar);
      color: var(--paper);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.2s;
    }
    .send-btn:hover { background: var(--cinnabar-deep); transform: scale(1.05); }
    .send-btn:disabled { background: var(--ink-20); cursor: not-allowed; transform: none; }
    .voice-toggle {
      width: 44px; height: 44px;
      border: 1px solid var(--ink-10);
      border-radius: var(--r-sm);
      background: rgba(255,255,255,0.8);
      color: var(--ink);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.2s;
    }
    .voice-toggle.active { background: var(--cyan); color: var(--paper); border-color: var(--cyan); }
    .voice-toggle:hover { transform: scale(1.05); }
    .mic-toggle {
      width: 44px; height: 44px;
      border: 1px solid var(--ink-10);
      border-radius: var(--r-sm);
      background: rgba(255,255,255,0.8);
      color: var(--ink);
      cursor: pointer;
      display: grid; place-items: center;
      transition: all 0.2s;
    }
    .mic-toggle:hover { transform: scale(1.05); }
    .mic-toggle.recording {
      background: var(--cinnabar);
      color: var(--paper);
      border-color: var(--cinnabar);
      animation: pulse 1s infinite;
    }
    .mic-toggle:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-dot.listening { background: #378ADD; animation: pulse 1s infinite; }

    @media (max-width: 980px) {
      .page-teacher .teacher-main { grid-template-columns: 1fr; height: auto; }
      .teacher-stage { height: 480px; }
      .teacher-chat { height: 500px; }
    }
  </style>
</head>
<body class="page-teacher">
  <div class="app-shell">
    <main class="main">
      <div class="container" style="padding-top: 8px;">
        <div class="teacher-main">
          <!-- 3D 舞台 -->
          <div class="teacher-stage">
            <div class="stage-bg-ink ink-1"></div>
            <div class="stage-bg-ink ink-2"></div>
            <div class="stage-title">
              <div class="name">越韵先生</div>
              <div class="sub">AI 虚拟越剧老师</div>
            </div>
            <div class="stage-seal"><span class="seal seal-vertical">师</span></div>
            <div class="teacher-status" id="teacherStatus">
              <span class="status-dot" id="statusDot"></span>
              <span id="statusText">初始化中</span>
            </div>
            <div class="stage-controls">
              <button class="stage-ctrl-btn active" id="btnVoice" title="语音朗读" aria-label="语音朗读">🔊</button>
              <button class="stage-ctrl-btn" id="btnStopVoice" title="停止朗读" aria-label="停止朗读">⏹</button>
              <button class="stage-ctrl-btn" id="btnRotate" title="旋转视角" aria-label="旋转视角">🔄</button>
            </div>
            <div class="teacher-bubble" id="teacherBubble"></div>
            <div class="emoji-bubble" id="emojiBubble">🙂</div>
            <div class="teacher-subtitle" id="teacherSubtitle"></div>
            <div class="stage-loading" id="stageLoading">
              <div class="loader-content">
                <!-- 首屏水墨占位：模型加载期间先呈现静态形象，体感秒开 -->
                <svg class="loader-ink" viewBox="0 0 200 260" width="150" height="195" aria-hidden="true">
                  <g fill="none" stroke="#3a7d7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
                    <!-- 头冠 -->
                    <path d="M95 34 q5 -12 10 0 q-5 8 -10 0 Z" />
                    <path d="M88 40 h24" />
                    <!-- 发髻 -->
                    <path d="M100 44 q0 -14 14 -10 q6 2 2 10" />
                    <!-- 脸 -->
                    <path d="M90 48 q10 -10 20 0 q2 22 0 34 q-10 8 -20 0 q-2 -12 0 -34 Z" />
                    <!-- 眉 -->
                    <path d="M95 68 q4 -3 7 0" />
                    <path d="M112 68 q-3 -3 -7 0" />
                    <!-- 眼 -->
                    <path d="M96 74 q3 3 6 0" opacity="0.9" />
                    <path d="M111 74 q-3 3 -6 0" opacity="0.9" />
                    <!-- 嘴 -->
                    <path d="M99 90 q3 3 6 2" />
                    <!-- 颈 -->
                    <path d="M99 96 q1 8 -2 12 M101 96 q-1 8 2 12" />
                    <!-- 身段 -->
                    <path d="M88 112 q12 -8 24 0 q6 6 4 20 q-4 26 -2 44 q-1 16 -14 12 q-12 4 -14 -12 q2 -18 -2 -44 q-2 -14 4 -20 Z" />
                    <!-- 水袖 -->
                    <path d="M84 124 q-14 6 -18 22 M116 124 q14 6 18 22" />
                  </g>
                </svg>
                <div class="loader-text">越韵先生正在登台...</div>
              </div>
            </div>
            <canvas id="teacherCanvas"></canvas>
          </div>

          <!-- 对话区 -->
          <div class="teacher-chat">
            <div class="chat-header">
              <div>
                <div class="title">向越韵先生请教</div>
                <div class="subtitle">基于 RAG 知识库 · 语音教学</div>
              </div>
            </div>
            <div class="chat-history" id="chatHistory">
              <div class="msg assistant">
                <div class="msg-avatar">师</div>
                <div class="msg-body">
                  <div class="msg-bubble">同学你好，我是越韵先生。关于越剧的流派、剧目、唱腔、身段，都可以问我。点击下方示例问题开始吧。</div>
                </div>
              </div>
            </div>
            <div class="chat-input-area">
              <div class="example-qs" id="exampleQs">
                <span class="example-q" data-q="越剧有哪些主要流派？">越剧有哪些主要流派？</span>
                <span class="example-q" data-q="袁派有什么特点？">袁派有什么特点？</span>
                <span class="example-q" data-q="红楼梦里宝玉哭灵的唱词有什么特色？">宝玉哭灵的唱词特色？</span>
                <span class="example-q" data-q="小生行当的表演要领是什么？">小生表演要领？</span>
                <span class="example-q" data-q="梁祝的故事梗概是什么？">梁祝故事梗概？</span>
              </div>
              <div class="chat-composer">
                <button class="voice-toggle active" id="voiceToggle" title="语音开关" aria-label="语音开关">🔊</button>
                <button class="mic-toggle" id="micBtn" title="语音提问" aria-label="语音提问">🎤</button>
                <textarea id="msgInput" placeholder="向越韵先生提问..." rows="1" aria-label="向越韵先生提问"></textarea>
                <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">➤</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 运行库改为 async 并行下载，不阻塞首屏 DOM；virtual-teacher.js 会等待其就绪后再初始化 -->
  <script src="/js/3d-stage-runtime.js?v=20260913-mtyq5uoh" async></script>
  <script src="/js/common.js?v=20260911-mtwo77gk"></script>
  <script src="/js/virtual-teacher.js?v=20260911-mtwo77gk"></script>
</body>
</html>
