<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>锦鲤模型 · 游泳动画检查</title>
<style>body{margin:0;background:#dbe3dc;font:14px sans-serif;color:#365045}canvas{display:block;width:100vw;height:100vh}aside{position:absolute;left:24px;top:24px;background:#fff9;padding:18px;border-radius:8px}button{padding:10px;margin-right:8px}a{color:inherit}#info{font-size:12px;max-width:400px;line-height:1.8}</style>
<canvas id="view"></canvas><aside><strong>7PLUS · Koi Fish</strong><p>作者原版游泳动画 · CC BY 4.0</p><button id="pause">暂停游泳</button><button id="side">侧面</button><button id="top">俯视</button><p id="info">加载中…</p><a href="https://sketchfab.com/3d-models/koi-fish-236859b809984f52b70c94fd040b9c59" target="_blank">模型来源</a></aside>
<script src="/js/3d-stage-runtime.js"></script><script>
(async()=>{const{THREE,GLTFLoader}=Yueju3D;const canvas=document.getElementById('view');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;const scene=new THREE.Scene();scene.background=new THREE.Color('#dbe3dc');scene.add(new THREE.HemisphereLight('#fff6e8','#617b72',2.8));const light=new THREE.DirectionalLight('#fff4df',3);light.position.set(-3,6,8);scene.add(light);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);let top=false;function view(){camera.position.set(0,top?13:3,top?.01:13);camera.lookAt(0,0,0);}view();const gltf=await new GLTFLoader().loadAsync('/assets/3d-stage/sky-koi/yueyun-sky-koi.glb');scene.add(gltf.scene);const box=new THREE.Box3().setFromObject(gltf.scene);gltf.scene.position.sub(box.getCenter(new THREE.Vector3()));const mixer=new THREE.AnimationMixer(gltf.scene);mixer.clipAction(gltf.animations[0]).play();let paused=false,last=0;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'继续游泳':'暂停游泳';};document.getElementById('side').onclick=()=>{top=false;view();};document.getElementById('top').onclick=()=>{top=true;view();};document.getElementById('info').textContent=JSON.stringify({size:box.getSize(new THREE.Vector3()).toArray(),clips:gltf.animations.map(c=>({name:c.name,duration:c.duration,tracks:c.tracks.length}))});function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(!paused)mixer.update(dt);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});})().catch(e=>document.getElementById('info').textContent=e.message);
</script></html>
