# ============================================================
# 越韵智传 · Nginx 反向代理模板（4核4G 单机）
# ------------------------------------------------------------
# 安装：
#   sudo cp deploy/4c4g/nginx-yueyun.conf /etc/nginx/sites-available/yueyun
#   sudo ln -sf /etc/nginx/sites-available/yueyun /etc/nginx/sites-enabled/yueyun
#   sudo nginx -t && sudo systemctl reload nginx
#
# 把本文件里的 yueyun.example.com 换成你的域名后再启用证书（certbot）。
# ============================================================

# WebSocket / SSE 需要把 Connection 头改成 upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream yueyun_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name yueyun.example.com;

    # ⚠️ 关键：默认只有 1MB，上传 PDF/视频会被 413 拒绝。
    #    前端 PDF 导入已改为 256KB 分片，但视频等大文件仍走整体上传。
    client_max_body_size 1024m;
    client_body_timeout 600s;

    access_log /var/log/nginx/yueyun.access.log;
    error_log  /var/log/nginx/yueyun.error.log warn;

    # 压缩交给 Node 的 compression 中间件处理，避免二次压缩反而变慢
    gzip off;

    # ---------- 实时流式接口：必须关闭缓冲，否则前端表现为「点了没反应」 ----------
    location ~ ^/api/(chat|agent|multi-agent|ai-assist|course/import/task) {
        proxy_pass http://yueyun_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---------- WebSocket（聊天室 / 身段测评） ----------
    location /ws {
        proxy_pass http://yueyun_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /pose-ws {
        proxy_pass http://yueyun_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ---------- 大文件上传与视频 Range 播放 ----------
    location ~ ^/api/(course|videos?|image)/ {
        proxy_pass http://yueyun_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # 边收边转，省内存
        proxy_buffering off;           # 支持视频拖动（Range 206）
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---------- 其余接口与静态资源 ----------
    location / {
        proxy_pass http://yueyun_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
